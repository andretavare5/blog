baseURL: "https://tavares.re/"
title: André Tavares
languageCode: en
theme: PaperMod
pagination:
  pagerSize: 20
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: "Senior threat researcher specializing in malware analysis, reverse engineering, botnet tracking, and detection. Research and CV by André Tavares."
  author: André Tavares
  images: ["images/social-card.png"]
  mainSections: [posts]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  ShowReadingTime: false
  ShowWordCount: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  comments: false
  showtoc: false
  assets:
    favicon: favicon.ico
    favicon16x16: favicon.ico
    favicon32x32: favicon.ico
    apple_touch_icon: favicon.ico
    safari_pinned_tab: favicon.ico
  label:
    text: tavares.re
  socialIcons:
    - name: email
      url: "mailto:andretavare5@proton.me"
    - name: linkedin
      url: "https://www.linkedin.com/in/andretavare5"
    - name: github
      title: Public code on GitHub Gist
      url: "https://gist.github.com/andretavare5"
    - name: x
      url: "https://x.com/andretavare5"
  cover:
    hidden: true
  social:
    twitter: andretavare5

menu:
  main:
    - identifier: posts
      name: Research
      url: /posts/
      weight: 10
    - identifier: about
      name: About / CV
      url: /about/
      weight: 20
    - identifier: tags
      name: Topics
      url: /tags/
      weight: 30

markup:
  highlight:
    noClasses: false

permalinks:
  page:
    posts: :filename
