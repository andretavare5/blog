<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "en" }}" dir="{{ .Language.LanguageDirection | default "auto" }}">
<head>{{ partial "head.html" . }}</head>
<body class="{{ if ne .Kind "page" }}list{{ end }}{{ if eq site.Params.defaultTheme "dark" }} dark{{ end }}{{ if .IsHome }} home{{ end }}{{ if eq .Layout "cv" }} cv-page{{ end }}" id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partialCached "header.html" . .Page }}
  <main class="main" id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partialCached "footer.html" . .Layout .Kind (.Param "hideFooter") (.Param "ShowCodeCopyButtons") }}
</body>
</html>
